<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiSTer Manager</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --text: #1d1b19; --muted: #6b665f; --line: #e2ddd5;
  --accent: #c2410c; --accent-text: #ffffff; --cover: #e9e4dc;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151413; --panel: #1f1d1b; --text: #eeeae4; --muted: #a29b91; --line: #34312d;
          --accent: #fb923c; --accent-text: #1a1009; --cover: #2a2724; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); }
.top { padding: 10px 16px; display: flex; align-items: center; gap: 12px; max-width: 1200px; margin: 0 auto; }
.top h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
.now { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now b { color: var(--text); font-weight: 600; }
.search { padding: 0 16px 10px; max-width: 1200px; margin: 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search input[type=search] { flex: 1; min-width: 160px; font: inherit; padding: 9px 12px; border-radius: 10px;
                             border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.search label { color: var(--muted); font-size: 13px; display: flex; gap: 4px; align-items: center; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
         border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stat span { display: block; color: var(--muted); font-size: 12px; }
.stat strong { font-size: 15px; font-variant-numeric: tabular-nums; }
details.info > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.systems { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.systems button { font-size: 13px; padding: 5px 10px; }
.systems button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.systems small { opacity: .7; margin-left: 4px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
        display: flex; flex-direction: column; }
.cover { aspect-ratio: 3 / 4; background: var(--cover); display: flex; align-items: center; justify-content: center;
         color: var(--muted); font-size: 12px; text-align: center; padding: 8px; position: relative; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.card .body { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card .name { font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; flex: 1; }
.card .sub { color: var(--muted); font-size: 11px; }
.card button { width: 100%; }
.hint { color: var(--muted); font-size: 13px; padding: 12px 0; }
#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--text); color: var(--bg);
         padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>MiSTer</h1>
    <div class="now" id="now">…</div>
    <button id="menu" title="Back to the MiSTer menu">Menu</button>
  </div>
  <div class="search">
    <input type="search" id="q" placeholder="Search all games" autocomplete="off">
    <label id="altwrap" hidden><input type="checkbox" id="alt"> other versions</label>
  </div>
</header>
<main>
  <details class="info">
    <summary>System</summary>
    <div class="stats" id="stats"></div>
    <button id="rescan" title="Read the SD card again">Rescan games</button>
  </details>
  <div class="systems" id="systems"></div>
  <section id="recentbox" hidden>
    <h2>Recent</h2>
    <div class="grid" id="recent"></div>
  </section>
  <h2 id="listtitle">Games</h2>
  <div class="grid" id="games"></div>
  <div class="hint" id="hint">Pick a system or type a name.</div>
</main>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
let system = '', timer = null, wasScanning = false, names = {};

const fmtBytes = b => b == null ? '–' : b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : (b / 1e6).toFixed(0) + ' MB';
const fmtUptime = s => { if (s == null) return '–'; s = Math.floor(s); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + 'd ' : '') + (h ? h + 'h ' : '') + m + 'm'; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2500); }

async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function status() {
  try {
    const s = await api('/api/status'), sys = s.system, now = s.now;
    $('now').innerHTML = !now.core || now.core.toUpperCase() === 'MENU' ? 'In the menu'
      : '<b>' + esc(now.game || now.core) + '</b>' + (now.game ? ' · ' + esc(now.core) : '');
    const used = sys.mem.total - sys.mem.available;
    const items = [
      ['CPU', sys.cpu == null ? '–' : sys.cpu + ' %'],
      ['Linux memory', fmtBytes(used) + ' / ' + fmtBytes(sys.mem.total)],
      ['SD free', sys.disk ? fmtBytes(sys.disk.free) : '–'],
      ['Uptime', fmtUptime(sys.uptime)],
      ['IP', sys.ip || '–'],
      ['Wi-Fi', sys.wifi ? (sys.wifi.ssid || sys.wifi.iface) + ' · ' + sys.wifi.level + ' dBm' : 'cable / off'],
    ];
    $('stats').innerHTML = items.map(([k, v]) => '<div class="stat"><span>' + k + '</span><strong>' + esc(v) + '</strong></div>').join('');
    if (wasScanning && !s.scanning) { systems(); games(); }
    wasScanning = s.scanning;
    $('rescan').disabled = s.scanning;
    $('rescan').textContent = s.scanning ? 'Scanning…' : 'Rescan games';
  } catch (e) { $('now').textContent = 'MiSTer not answering'; }
}

function card(g, sub) {
  const div = document.createElement('div');
  div.className = 'card';
  const cover = g.art
    ? '<img loading="lazy" alt="" src="/art/' + g.art.split('/').map(encodeURIComponent).join('/') + '">'
    : esc(g.name);
  div.innerHTML = '<div class="cover">' + cover + '</div><div class="body"><div class="name">' + esc(g.name) + '</div>'
    + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '<button class="primary">Play</button></div>';
  const img = div.querySelector('img');
  if (img) img.onerror = () => { img.remove(); div.querySelector('.cover').textContent = g.name; };
  div.querySelector('button').onclick = async ev => {
    ev.target.disabled = true;
    try { await api('/api/launch', {system: g.system, path: g.path}); toast('Loading ' + g.name); setTimeout(() => { status(); recent(); }, 1500); }
    catch (e) { toast('Error: ' + e.message); }
    ev.target.disabled = false;
  };
  return div;
}

async function recent() {
  const list = await api('/api/recent').catch(() => []);
  $('recentbox').hidden = !list.length;
  $('recent').replaceChildren(...list.slice(0, 6).map(g => card(g, names[g.system] || g.system)));
}

async function systems() {
  const list = await api('/api/systems');
  names = Object.fromEntries(list.map(s => [s.id, s.name]));
  const box = $('systems');
  const all = {id: '', name: 'All', count: list.reduce((n, s) => n + s.count, 0)};
  box.replaceChildren(...[all, ...list].map(s => {
    const b = document.createElement('button');
    b.innerHTML = esc(s.name) + '<small>' + s.count + '</small>';
    b.classList.toggle('on', s.id === system);
    b.onclick = () => { system = s.id; [...box.children].forEach(c => c.classList.toggle('on', c === b));
                        $('q').placeholder = s.id ? 'Search ' + s.name : 'Search all games'; games(); };
    return b;
  }));
  if (!list.length) $('hint').textContent = 'No games found yet. The first scan can take a minute.';
}

async function games() {
  const q = $('q').value.trim();
  $('altwrap').hidden = system !== 'Arcade';
  if (!system && !q) { $('games').replaceChildren(); $('listtitle').textContent = 'Games';
                       $('hint').textContent = 'Pick a system or type a name.'; $('hint').hidden = false; return; }
  const params = new URLSearchParams({system, q, alt: $('alt').checked ? '1' : '0'});
  const list = await api('/api/games?' + params);
  $('listtitle').textContent = (system ? names[system] : 'All systems') + (q ? ' · “' + q + '”' : '');
  $('games').replaceChildren(...list.map(g => card(g, system ? (g.alt ? 'other version' : '') : names[g.system])));
  $('hint').hidden = list.length > 0 && list.length < 500;
  $('hint').textContent = list.length ? 'Showing the first 500. Type to narrow.' : 'No match.';
}

$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(games, 250); };
$('alt').onchange = games;
$('menu').onclick = async () => { try { await api('/api/menu', {}); toast('Back to the menu'); setTimeout(status, 1500); } catch (e) { toast('Error: ' + e.message); } };
$('rescan').onclick = async () => { await api('/api/rescan', {}); wasScanning = true; status(); };

status(); systems().then(games); recent();
setInterval(status, 5000);
</script>
</body>
</html>
