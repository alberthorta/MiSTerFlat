; MiSTerLily firmware for the LILYGO T-Display-S3 (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM).

[platformio]
default_envs = tdisplay_s3

[esp32s3]
; Pinned: espressif32 6.13.0 ships Arduino core 2.0.17.
platform = espressif32@6.13.0
board = lilygo-t-display-s3
framework = arduino
lib_deps =
    lovyan03/LovyanGFX@1.2.19
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; The PlatformIO board file omits this (LILYGO's own board file has it).
    -DBOARD_HAS_PSRAM
    ; The CDC port is the protocol channel: core log output there would corrupt it.
    -DCORE_DEBUG_LEVEL=0
    -Wall
monitor_speed = 115200
upload_speed = 921600
test_ignore = *

[env:tdisplay_s3]
extends = esp32s3
build_flags =
    ${esp32s3.build_flags}
    -DMDS_DEBUG_LOG=0

; Same firmware with our debug log on UART0 (GPIO43 TX / GPIO44 RX, 115200 baud).
; The USB CDC port stays clean in both builds.
[env:tdisplay_s3_debug]
extends = esp32s3
build_flags =
    ${esp32s3.build_flags}
    -DMDS_DEBUG_LOG=1
    ; MDSHANG: spin forever, to check that the watchdog resets the board.
    -DMDS_TEST_COMMANDS=1

; Waveshare ESP32-S3-Touch-LCD-2 (240x320 SPI panel). Same chip, flash and PSRAM; the PlatformIO
; board file for the T-Display-S3 fits it too (16 MB QIO flash, 8 MB OPI PSRAM).
[env:waveshare_lcd2]
extends = esp32s3
build_flags =
    ${esp32s3.build_flags}
    -DMDS_BOARD_WAVESHARE_LCD2
    -DMDS_DEBUG_LOG=0

; Host unit tests for the protocol library: `pio test -e native`.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
