# Builds the firmware of every board for a version tag and publishes it as a GitHub release, one
# misterlily-<version>-<env>.bin per board. misterlily_flash.py (and MiSTerManager through it)
# flashes the one for the connected board.
#
#   1. set MDS_FW_VERSION in firmware/include/config.h, commit
#   2. git tag v0.2.0 && git push origin v0.2.0
name: Release firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Tag matches the firmware version
        run: |
          version="$(sed -n 's/^#define MDS_FW_VERSION "\(.*\)"$/\1/p' firmware/include/config.h)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but MDS_FW_VERSION is $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: |
          pip install platformio
          cd firmware && pio run -e tdisplay_s3 -e waveshare_lcd2

      - name: Check the images as the MiSTer will
        run: |
          python3 - <<'PY'
          import os, shutil, sys
          sys.path.insert(0, "mister")
          import misterlily_flash as mf
          from mdsserial import BOARDS
          version = os.environ["VERSION"]
          for board, env in BOARDS.items():
              src = "firmware/.pio/build/{}/firmware.bin".format(env)
              got = mf.image_info(open(src, "rb").read())
              assert got == (board, version), (env, got)
              shutil.copy(src, "misterlily-{}-{}.bin".format(version, env))
              print("image ok:", env, got)
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" misterlily-"$VERSION"-*.bin \
            --title "MiSTerLily $VERSION" --generate-notes
